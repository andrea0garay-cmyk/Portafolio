<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrea Garay — Portafolio 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="portfolio-body">

  <!-- Main Canvas for Behance Project -->
  <main class="behance-project-canvas" id="projectCanvas">

    <!-- PAGE 1: COVER -->
    <section class="portfolio-slide" id="page-1" data-page="1">
      <div class="slide-aspect-box">
        <img src="assets/pdf_nuevo/page_01.jpg" alt="Portada Portafolio Andrea Garay 2026" class="slide-base-img" loading="eager" />
      </div>
    </section>

    <!-- PAGE 2: ABOUT ME -->
    <section class="portfolio-slide" id="page-2" data-page="2">
      <div class="slide-aspect-box">
        <img src="assets/pdf_nuevo/page_02.jpg" alt="About Me Andrea Garay" class="slide-base-img" />
        <div class="camera-screen-overlay" id="cameraScreenOverlay">
          <div class="camera-photo-flare"></div>
        </div>
      </div>
    </section>

    <!-- PAGE 3: ¿MI ESPECIALIDAD? -->
    <section class="portfolio-slide" id="page-3" data-page="3">
      <div class="slide-aspect-box">
        <img src="assets/pdf_nuevo/page_03.jpg" alt="¿Mi Especialidad?" class="slide-base-img" />
      </div>
    </section>

    <!-- PAGE 4: MI TRABAJO -->
    <section class="portfolio-slide" id="page-4" data-page="4">
      <div class="slide-aspect-box">
        <img src="assets/pdf_nuevo/page_04.jpg" alt="Mi Trabajo" class="slide-base-img" />
      </div>
    </section>

    <!-- PAGE 5: IDENTIDAD VISUAL -->
    <section class="portfolio-slide" id="page-5" data-page="5">
      <div class="slide-aspect-box">
        <img src="assets/pdf_nuevo/page_05.jpg" alt="Identidad Visual - Maua & Seraya" class="slide-base-img" />
      </div>
    </section>

    <!-- PAGE 6: SOCIAL MEDIA — ANIMATION 2 (TIRA ROJA PORTAFOLIO AG SUPERIOR) -->
    <section class="portfolio-slide" id="page-6" data-page="6">
      <div class="slide-aspect-box">
        <img src="assets/pdf_nuevo/page_06.jpg" alt="Social Media" class="slide-base-img" />

        <!-- Top Continuous Marquee Strip moving to the LEFT -->
        <div class="marquee-strip-wrapper marquee-top" id="marqueeTop">
          <div class="marquee-track">
            <img src="assets/pdf_nuevo/strip_page06.png" alt="PORTAFOLIO AG" class="marquee-segment" />
            <img src="assets/pdf_nuevo/strip_page06.png" alt="PORTAFOLIO AG" class="marquee-segment" />
            <img src="assets/pdf_nuevo/strip_page06.png" alt="PORTAFOLIO AG" class="marquee-segment" />
            <img src="assets/pdf_nuevo/strip_page06.png" alt="PORTAFOLIO AG" class="marquee-segment" />
          </div>
        </div>
      </div>
    </section>

    <!-- PAGE 7: POST -->
    <section class="portfolio-slide" id="page-7" data-page="7">
      <div class="slide-aspect-box">
        <img src="assets/pdf_nuevo/page_07.jpg" alt="Social Media Post" class="slide-base-img" />
      </div>
    </section>

    <!-- PAGE 8: CARRUSEL -->
    <section class="portfolio-slide" id="page-8" data-page="8">
      <div class="slide-aspect-box">
        <img src="assets/pdf_nuevo/page_08.jpg" alt="Social Media Carrusel" class="slide-base-img" />
      </div>
    </section>

    <!-- PAGE 9: STORIES -->
    <section class="portfolio-slide" id="page-9" data-page="9">
      <div class="slide-aspect-box stories-aspect-box">
        <img src="assets/pdf_nuevo/page_09.jpg" alt="Stories Celular Mockup" class="slide-base-img" />
      </div>
    </section>

    <!-- PAGE 10: ILUSTRACIÓN -->
    <section class="portfolio-slide" id="page-10" data-page="10">
      <div class="slide-aspect-box">
        <img src="assets/pdf_nuevo/page_10.jpg" alt="Ilustración" class="slide-base-img" />
      </div>
    </section>

    <!-- PAGE 11: SEARCH KEY VISUALS -->
    <section class="portfolio-slide" id="page-11" data-page="11">
      <div class="slide-aspect-box">
        <img src="assets/pdf_nuevo/page_11.jpg" alt="Search Key Visuals - Agua 'e Lulo" class="slide-base-img" />
      </div>
    </section>

    <!-- PAGE 12: EDICIÓN DE VIDEOS -->
    <section class="portfolio-slide" id="page-12" data-page="12">
      <div class="slide-aspect-box">
        <img src="assets/pdf_nuevo/page_12.jpg" alt="Edición de Videos" class="slide-base-img" />
        <div class="video-edition-workspace" id="videoEditionWorkspace">
          <video class="edition-video-element" controls playsinline preload="metadata" aria-label="Video de edición 1">
            <source src="assets/videos/video_edicion_1.mp4" type="video/mp4">
          </video>
          <video class="edition-video-element" controls playsinline preload="metadata" aria-label="Video de edición 2">
            <source src="assets/videos/video_edicion_2.mp4" type="video/mp4">
          </video>
        </div>

        <!-- Bottom Continuous Marquee Strip moving to the LEFT -->
        <div class="marquee-strip-wrapper marquee-bottom" id="marqueeBottom">
          <div class="marquee-track">
            <img src="assets/pdf_nuevo/strip_page12.png" alt="PORTAFOLIO AG" class="marquee-segment" />
            <img src="assets/pdf_nuevo/strip_page12.png" alt="PORTAFOLIO AG" class="marquee-segment" />
            <img src="assets/pdf_nuevo/strip_page12.png" alt="PORTAFOLIO AG" class="marquee-segment" />
            <img src="assets/pdf_nuevo/strip_page12.png" alt="PORTAFOLIO AG" class="marquee-segment" />
          </div>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
