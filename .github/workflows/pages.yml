name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir -p _site/assets/videos
          cp 02_Experiencia_Web_Interactiva/index.html _site/
          cp 02_Experiencia_Web_Interactiva/styles.css _site/
          cp -R 02_Experiencia_Web_Interactiva/assets/pdf_nuevo _site/assets/
          cp 02_Experiencia_Web_Interactiva/assets/videos/video_edicion_1.mp4 _site/assets/videos/
          cp 02_Experiencia_Web_Interactiva/assets/videos/video_edicion_2.mp4 _site/assets/videos/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
